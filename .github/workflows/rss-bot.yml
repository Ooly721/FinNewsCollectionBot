name: RSS 财经新闻自动推送

on:
  schedule:
    - cron: '0 0 * * *'   # UTC 0:00 = 北京时间 8:00
    - cron: '0 9 * * *'   # UTC 9:00 = 北京时间 17:00
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: 克隆仓库
        uses: actions/checkout@v3
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 运行采集脚本
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SERVER_CHAN_KEYS: ${{ secrets.SERVER_CHAN_KEYS }}
        run: python financebot.py
      
      - name: 上传数据库文件
        uses: actions/upload-artifact@v4
        with:
          name: news_history
          path: news_history.db
